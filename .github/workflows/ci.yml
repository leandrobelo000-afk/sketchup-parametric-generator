name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: pip install -r backend_python/requirements-dev.txt
      - run: ruby tests/ruby/test_plugin.rb
      - run: pytest -q
